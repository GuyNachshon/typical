<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ink.js dev — inkBars / stipple / ledger</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { padding: 48px clamp(24px, 8vw, 96px); display: flex; flex-direction: column; gap: 64px; }
  .dev-block h2 { font-size: var(--text-heading-sm); margin-bottom: 20px; }
  .dev-stipple-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .dev-stipple-cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dev-stipple-cell canvas { width: 140px; height: 140px; background: var(--color-bone); border-radius: var(--radius-lg); }
  .dev-stipple-cell span { font-family: var(--font-serif); font-size: 20px; }
</style>
</head>
<body>

  <div class="dev-block">
    <h2 class="serif">inkBars — museum-label list</h2>
    <div class="card" style="max-width:520px;">
      <div id="dev-inkbars"></div>
    </div>
  </div>

  <div class="dev-block room-dark room" style="padding:32px;border-radius:9px;">
    <h2 class="serif">inkBars — on ink (dark room)</h2>
    <div id="dev-inkbars-dark"></div>
  </div>

  <div class="dev-block">
    <h2 class="serif">stipple — engraving-style dot field, density &prop; p</h2>
    <div class="dev-stipple-row" id="dev-stipple"></div>
  </div>

  <div class="dev-block room-chalk room" style="padding:32px;border-radius:9px;">
    <h2 class="serif">ledger — decision register</h2>
    <div class="ink-ledger" id="dev-ledger"></div>
  </div>

<script type="module">
import { inkBars, stipple, ledger } from './js/ink.js';

inkBars(document.getElementById('dev-inkbars'), {
  rows: [
    { label: 'billing', p: 0.05 },
    { label: 'shipping', p: 0.35 },
    { label: 'support', p: 0.58 },
    { label: 'retention', p: 0.02 },
  ],
  nullP: 0.08,
});

inkBars(document.getElementById('dev-inkbars-dark'), {
  rows: [
    { label: 'no', p: 0.02 },
    { label: 'yes', p: 0.91 },
  ],
  nullP: 0.03,
});

const stippleRow = document.getElementById('dev-stipple');
[0.1, 0.35, 0.6, 0.85, 1.0].forEach((p) => {
  const cell = document.createElement('div');
  cell.className = 'dev-stipple-cell';
  const canvas = document.createElement('canvas');
  cell.appendChild(canvas);
  const label = document.createElement('span');
  label.textContent = `p = ${p.toFixed(2)}`;
  cell.appendChild(label);
  stippleRow.appendChild(cell);
  stipple(canvas, p, { seed: 3 });
});

const reg = ledger(document.getElementById('dev-ledger'));
const fake = [
  { text: "Ticket #7734: I was charged twice for my last order.", decision: 'support', p: 0.58, ms: 211 },
  { text: 'Alert: disk usage at 92% on db-primary-3.', decision: 'page', p: 0.83, ms: 44 },
  { text: 'Agent step: fetched order history for customer #221.', decision: 'read_file', p: 0.71, ms: 39 },
  { text: 'Ad observation: "Get 20% off your first order today."', decision: 'advertisement', p: 0.94, ms: 41 },
  { text: 'Policy check: refund requested within 30-day window.', decision: 'yes', p: 0.99, ms: 38 },
];
fake.forEach((e, i) => setTimeout(() => reg.push(e), i * 250));
</script>
</body>
</html>
