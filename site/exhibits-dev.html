<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>exhibits-dev — Atoms</title>
<link rel="stylesheet" href="exhibits.css" />
<style>
  body { background: #000; margin: 0; padding: 32px; }
  .exhibits-dev-head { font-family: var(--ex-font); color: var(--ex-cream); font-size: 12px; margin: 0 0 20px; }
</style>
</head>
<body>
  <p class="exhibits-dev-head">exhibits-dev — sql / doc-20 / rules / ads / compaction, isolated</p>
  <div class="exhibits-dev-grid">
    <div class="ex-card"><div data-demo="sql"></div></div>
    <div class="ex-card"><div data-demo="doc-20"></div></div>
    <div class="ex-card"><div data-demo="rules"></div></div>
    <div class="ex-card"><div data-demo="ads"></div></div>
    <div class="ex-card"><div data-demo="compaction"></div></div>
  </div>

<script type="module">
import { decide, mode } from './js/api.js';
import { inkBars } from './js/ink.js';

const presets = await fetch('data/presets.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
const ctx = { decide, mode, inkBars, presets };

document.querySelectorAll('[data-demo]').forEach((el) => {
  const name = el.dataset.demo;
  import(`./js/demos/${name}.js`)
    .then((m) => m.mount(el, ctx))
    .catch((err) => {
      el.textContent = `${name} failed to mount`;
      console.error(name, err);
    });
});
</script>
</body>
</html>
